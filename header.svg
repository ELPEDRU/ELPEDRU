<svg width="900" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#1a1025"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.3"/>
    </filter>
    <filter id="textshadow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="16" fill="url(#bg)"/>

  <!-- Animated grid lines -->
  <g opacity="0.05">
    <line x1="0" y1="50" x2="900" y2="50" stroke="#a855f7" stroke-width="1">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="100" x2="900" y2="100" stroke="#a855f7" stroke-width="1">
      <animate attributeName="opacity" values="0.05;0.1;0.05" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="150" x2="900" y2="150" stroke="#a855f7" stroke-width="1">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#a855f7" stroke-width="1">
      <animate attributeName="opacity" values="0.05;0.1;0.05" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="250" x2="900" y2="250" stroke="#a855f7" stroke-width="1">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="4.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Floating particles -->
  <circle cx="100" cy="80" r="2" fill="#7c3aed" opacity="0.4">
    <animate attributeName="cy" values="80;60;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="220" r="1.5" fill="#a855f7" opacity="0.3">
    <animate attributeName="cy" values="220;200;220" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="60" r="2.5" fill="#7c3aed" opacity="0.3">
    <animate attributeName="cy" values="60;40;60" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="200" r="1.5" fill="#a855f7" opacity="0.4">
    <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="40" r="2" fill="#c084fc" opacity="0.2">
    <animate attributeName="cy" values="40;25;40" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="260" r="1.8" fill="#7c3aed" opacity="0.3">
    <animate attributeName="cy" values="260;240;260" dur="6.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Accent line bottom -->
  <rect x="0" y="296" width="900" height="4" rx="0" fill="url(#purple)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Terminal bracket -->
  <text x="80" y="105" font-family="'Courier New', monospace" font-size="18" fill="#7c3aed" opacity="0.6">&gt;_</text>

  <!-- Name with animation -->
  <text x="80" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="bold" fill="white" filter="url(#textshadow)">
    Anas
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- Typing effect for subtitle -->
  <text x="82" y="175" font-family="'Courier New', monospace" font-size="18" fill="#a855f7">
    Full Stack Developer &amp; Game Server Engineer
    <animate attributeName="opacity" values="0;0;1" dur="2s" fill="freeze"/>
  </text>

  <!-- Blinking cursor -->
  <rect x="470" y="160" width="2" height="20" fill="#a855f7">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Tags -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="70" height="28" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0;0.6" dur="2.5s" fill="freeze"/>
    </rect>
    <text x="35" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c084fc" text-anchor="middle">
      Lua
      <animate attributeName="opacity" values="0;1" dur="2.5s" fill="freeze"/>
    </text>

    <rect x="82" y="0" width="85" height="28" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0;0.6" dur="2.8s" fill="freeze"/>
    </rect>
    <text x="124" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c084fc" text-anchor="middle">
      Python
      <animate attributeName="opacity" values="0;1" dur="2.8s" fill="freeze"/>
    </text>

    <rect x="179" y="0" width="115" height="28" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0;0.6" dur="3.1s" fill="freeze"/>
    </rect>
    <text x="236" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c084fc" text-anchor="middle">
      JavaScript
      <animate attributeName="opacity" values="0;1" dur="3.1s" fill="freeze"/>
    </text>

    <rect x="306" y="0" width="90" height="28" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0;0.6" dur="3.4s" fill="freeze"/>
    </rect>
    <text x="351" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c084fc" text-anchor="middle">
      MySQL
      <animate attributeName="opacity" values="0;1" dur="3.4s" fill="freeze"/>
    </text>

    <rect x="408" y="0" width="100" height="28" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0;0.6" dur="3.7s" fill="freeze"/>
    </rect>
    <text x="458" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c084fc" text-anchor="middle">
      MTA:SA
      <animate attributeName="opacity" values="0;1" dur="3.7s" fill="freeze"/>
    </text>
  </g>

  <!-- Code decoration on the right -->
  <g transform="translate(650, 70)" opacity="0.15">
    <text font-family="'Courier New', monospace" font-size="14" fill="#a855f7">
      <tspan x="0" dy="0">function init()</tspan>
      <tspan x="0" dy="22">  local server =</tspan>
      <tspan x="0" dy="22">    createServer()</tspan>
      <tspan x="0" dy="22">  server:start()</tspan>
      <tspan x="0" dy="22">  print("online")</tspan>
      <tspan x="0" dy="22">end</tspan>
    </text>
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Border glow -->
  <rect width="900" height="300" rx="16" fill="none" stroke="url(#purple)" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>